<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Site</title>
  <meta name="description" content="Site pessoal simples e direto." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header>
    <a href="#/" class="site-name" id="site-name"></a>
    <nav id="nav-links"></nav>
  </header>

  <main id="content"></main>

  <footer>
    <span id="footer-copy"></span>
    <p><a href="#/legal">Privacidade e Termos</a></p>
  </footer>

  <!-- ordem importa: config → ui → router → app -->
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.getElementById("site-name").textContent = CONFIG.site.name;
    document.getElementById("footer-copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.site.name}`;
    document.documentElement.lang = CONFIG.site.lang;
  </script>

</body>

</html>
